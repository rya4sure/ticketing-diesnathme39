<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tiket TechFest 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; max-width: 420px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .header { background: #111; color: #fff; padding: 1.5rem; }
    .header p.event { font-size: 11px; letter-spacing: 0.1em; opacity: 0.6; margin-bottom: 6px; text-transform: uppercase; }
    .header h1 { font-size: 22px; margin-bottom: 4px; }
    .header p.tanggal { font-size: 12px; opacity: 0.6; }
    .body { padding: 1.5rem; display: flex; gap: 1.25rem; align-items: flex-start; }
    .info { flex: 1; }
    .row { margin-bottom: 10px; }
    .row-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .row-val { font-size: 14px; font-weight: 500; }
    .divider { border: none; border-top: 1px dashed #ddd; margin: 1rem 0; }
    .kode { font-family: monospace; font-size: 13px; color: #555; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; background: #e6f4ea; color: #1a7f3c; }
    .qr-wrap { flex-shrink: 0; text-align: center; }
    .qr-wrap p { font-size: 10px; color: #aaa; margin-top: 6px; }
    .not-found { text-align: center; padding: 3rem 1.5rem; color: #888; }
    .not-found h2 { font-size: 16px; margin-bottom: 8px; color: #333; }
  </style>
</head>
<body>
  <div class="card" id="tiket-wrap">
    <div style="text-align:center;padding:3rem;color:#888;">Memuat tiket...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const dbClient = window.supabase.createClient(
      CONFIG.supabase.url,
      CONFIG.supabase.anonKey
    )

    async function loadTiket() {
      const params = new URLSearchParams(window.location.search)
      const kode = params.get('kode')

      if (!kode) {
        tampilError('Kode tiket tidak ditemukan.', 'Pastikan link tiket kamu benar.')
        return
      }

      const { data, error } = await dbClient
        .from('peserta')
        .select('*')
        .eq('kode_tiket', kode.toUpperCase())
        .single()

      if (error || !data) {
        tampilError('Tiket tidak valid.', 'Kode "' + kode + '" tidak terdaftar.')
        return
      }

      tampilTiket(data)
    }

    function tampilTiket(p) {
      document.getElementById('tiket-wrap').innerHTML = `
        <div class="header">
          <p class="event">Event Kampus</p>
          <h1>TechFest 2025</h1>
          <p class="tanggal">Sabtu, 15 November 2025 · Aula Utama</p>
        </div>
        <div class="body">
          <div class="info">
            <div class="row">
              <div class="row-label">Nama</div>
              <div class="row-val">${p.nama}</div>
            </div>
            <div class="row">
              <div class="row-label">Email</div>
              <div class="row-val">${p.email}</div>
            </div>
            <div class="row">
              <div class="row-label">No. HP</div>
              <div class="row-val">${p.no_hp}</div>
            </div>
            <hr class="divider"/>
            <div class="row">
              <div class="row-label">Kode Tiket</div>
              <div class="kode">${p.kode_tiket}</div>
            </div>
            <div class="row">
              <div class="row-label">Status</div>
              <span class="badge">${p.sudah_hadir ? 'Sudah Hadir' : 'Valid'}</span>
            </div>
          </div>
          <div class="qr-wrap">
            <div id="qr-code"></div>
            <p>Scan untuk masuk</p>
          </div>
        </div>
      `

      new QRCode(document.getElementById('qr-code'), {
        text: p.kode_tiket,
        width: 110,
        height: 110,
        correctLevel: QRCode.CorrectLevel.M
      })
    }

    function tampilError(judul, pesan) {
      document.getElementById('tiket-wrap').innerHTML = `
        <div class="not-found">
          <h2>${judul}</h2>
          <p>${pesan}</p>
        </div>
      `
    }

    loadTiket()
  </script>
</body>
</html>
