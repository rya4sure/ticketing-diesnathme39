<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scanner Tiket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .card { background: #fff; border-radius: 12px; padding: 2rem; max-width: 420px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #333; }
    button { width: 100%; padding: 10px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
    button:hover { background: #333; }
    button:disabled { background: #999; cursor: not-allowed; }
    .result { border-radius: 8px; padding: 1rem; margin-top: 1rem; display: none; }
    .result.sukses { background: #e6f4ea; border: 1px solid #a8d5b5; }
    .result.gagal { background: #fdecea; border: 1px solid #f5c2c2; }
    .result h2 { font-size: 16px; margin-bottom: 4px; }
    .result p { font-size: 13px; color: #555; }
    .result.sukses h2 { color: #1a7f3c; }
    .result.gagal h2 { color: #c0392b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scanner Tiket</h1>
    <p class="sub">TechFest 2025 · Panitia</p>
    <label>Masukkan Kode Tiket</label>
    <input type="text" id="kode-input" placeholder="cth. TF-ABC123" />
    <button id="btn-validasi">Validasi Tiket</button>
    <div class="result" id="result">
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/scanner.js"></script>
  <script>
    document.getElementById('btn-validasi').addEventListener('click', validasi)
    document.getElementById('kode-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') validasi()
    })
  </script>
</body>
</html>
