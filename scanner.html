<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scanner Tiket HME</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 2rem 1rem; }
    .card { background: #fff; border-radius: 12px; padding: 2rem; max-width: 420px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin-bottom: 4px; text-align: center; }
    .sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; text-align: center; }
    
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; border: none !important; }
    #reader img { display: none; } 
    
    .separator { text-align: center; margin: 1rem 0; font-size: 12px; color: #aaa; position: relative; }
    .separator::before, .separator::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #eee; }
    .separator::before { left: 0; } .separator::after { right: 0; }
    
    label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #1a7f3c; }
    button { width: 100%; padding: 10px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
    button:hover { background: #333; }
    button:disabled { background: #999; cursor: not-allowed; }
    
    .result { border-radius: 8px; padding: 1rem; margin-top: 1rem; display: none; text-align: center; }
    .result.sukses { background: #e6f4ea; border: 1px solid #a8d5b5; }
    .result.gagal { background: #fdecea; border: 1px solid #f5c2c2; }
    .result h2 { font-size: 16px; margin-bottom: 4px; }
    .result p { font-size: 13px; color: #555; line-height: 1.4; }
    .result.sukses h2 { color: #1a7f3c; }
    .result.gagal h2 { color: #c0392b; }
    
    /* Tombol Khusus OTS */
    #btn-ots-konfirmasi { background: #1a7f3c; margin-top: 15px; display: none; }
    #btn-ots-konfirmasi:hover { background: #145f2e; }

    #reader__dashboard_section_csr span button { padding: 6px 12px; background: #1a7f3c; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    #reader__dashboard_section_swaplink { text-decoration: none; color: #1a7f3c; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scanner Tiket</h1>
    <p class="sub">Dies Natalis HME Ke-39 · Panitia</p>
    
    <div id="reader"></div>
    
    <div class="separator">ATAU MANUAL</div>

    <label>Masukkan Kode Tiket</label>
    <input type="text" id="kode-input" placeholder="cth. TF-ABC123" autocomplete="off" />
    <button id="btn-validasi">Validasi Tiket</button>
    
    <div class="result" id="result">
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
      <button id="btn-ots-konfirmasi">Terima Uang & Konfirmasi Hadir</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <script src="js/config.js"></script>
  <script src="js/scanner.js"></script>
  <script>
    document.getElementById('btn-validasi').addEventListener('click', () => validasi());
    document.getElementById('kode-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') validasi();
    });
    // Event listener untuk tombol OTS
    document.getElementById('btn-ots-konfirmasi').addEventListener('click', konfirmasiOTS);
  </script>
</body>
</html>
