<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Peserta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 2rem 1rem; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat { background: #fff; border-radius: 10px; padding: 1rem; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .stat-num { font-size: 28px; font-weight: 600; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .card { background: #fff; border-radius: 10px; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; color: #888; font-weight: 500; }
    td { padding: 10px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .btn-refresh { padding: 8px 16px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 1rem; }
    .btn-refresh:hover { background: #333; }
    .btn-konfirmasi { padding: 4px 10px; font-size: 12px; background: #1a7f3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .btn-konfirmasi:hover { background: #145f2e; }
    .btn-konfirmasi:disabled { background: #999; cursor: not-allowed; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #111; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; display: none; z-index: 999; }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Dashboard Peserta</h1>
    <p class="sub" style="margin-bottom: 1rem;">Dies Natalis HME Ke-39</p>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="s-total">-</div><div class="stat-label">Total Daftar</div></div>
      <div class="stat"><div class="stat-num" id="s-hadir">-</div><div class="stat-label">Sudah Hadir</div></div>
      <div class="stat"><div class="stat-num" id="s-belum">-</div><div class="stat-label">Belum Hadir</div></div>
    </div>

    <div class="stats" style="margin-top: -8px;">
      <div class="stat"><div class="stat-num" id="s-bakar" style="color:#d35400;">-</div><div class="stat-label">Ayam Bakar</div></div>
      <div class="stat"><div class="stat-num" id="s-katsu" style="color:#d35400;">-</div><div class="stat-label">Ayam Katsu</div></div>
      <div class="stat"><div class="stat-num" id="s-lava" style="color:#d35400;">-</div><div class="stat-label">Ayam Hot Lava</div></div>
    </div>

    <button class="btn-refresh" onclick="loadData()">Refresh Data</button>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Angkatan</th>
            <th>Harga</th>
            <th>Kode Tiket</th>
            <th>Menu</th>
            <th>Metode</th>
            <th>Status Bayar</th>
            <th>Bukti</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel-peserta">
          <tr><td colspan="9" style="text-align:center;color:#888;padding:2rem;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const dbClient = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey)

    // TODO: GANTI TULISAN DI BAWAH INI DENGAN URL GOOGLE APPS SCRIPT KAMU
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzN8UpkQpm3DxMq0VX73lM3PsaeGgjIuEtFkxaB3_t4T0veuEgD4oM3Ka_DMVndmuWp/exec";

    function showToast(pesan) {
      const toast = document.getElementById('toast')
      toast.textContent = pesan
      toast.classList.add('show')
      setTimeout(() => toast.classList.remove('show'), 3000)
    }

    // VERSI ANTI-BADAI: Menuliskan HTML secara eksplisit tanpa Array
    function badgeBayar(status) {
      if (status === 'lunas') {
        return '<span style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;background:#e6f4ea;color:#1a7f3c">Lunas</span>';
      } else if (status === 'menunggu_konfirmasi') {
        return '<span style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;background:#fff3cd;color:#856404">Menunggu Konfirmasi</span>';
      } else {
        return '<span style="display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;background:#fdecea;color:#c0392b">Belum Bayar</span>';
      }
    }

    async function konfirmasi(kode, btnEl) {
      if (!confirm('Konfirmasi pembayaran untuk kode ' + kode + '?')) return

      btnEl.disabled = true
      btnEl.textContent = 'Memproses...'

      // 1. Update ke Supabase
      const { error } = await dbClient
        .from('peserta')
        .update({ status_bayar: 'lunas' })
        .eq('kode_tiket', kode)

      if (error) {
        showToast('Gagal konfirmasi: ' + error.message)
        btnEl.disabled = false
        btnEl.textContent = 'Konfirmasi'
        return
      }

      // 2. Ambil data peserta untuk dikirim via email
      const { data: peserta } = await dbClient
        .from('peserta')
        .select('*')
        .eq('kode_tiket', kode)
        .single()

      if (peserta) {
        if (GAS_URL === "MASUKKAN_URL_GOOGLE_SCRIPT_DI_SINI") {
          showToast('✓ Lunas! Tapi email gagal karena URL GAS belum dimasukkan.');
          loadData();
          return;
        }

        try {
          // 3. Tembak data ke Google Apps Script
          await fetch(GAS_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain' 
            },
            body: JSON.stringify({
              nama: peserta.nama,
              email: peserta.email,
              kode_tiket: peserta.kode_tiket,
              menu: peserta.menu
            })
          })
          showToast('✓ Dikonfirmasi & E-Tiket dikirim ke ' + peserta.email)
        } catch (e) {
          showToast('✓ Dikonfirmasi tapi gagal kirim email.')
        }
      }

      loadData()
    }

    async function loadData() {
      const { data, error } = await dbClient
        .from('peserta')
        .select('*')
        .order('created_at', { ascending: false })

      if (error || !data) {
        document.getElementById('tabel-peserta').innerHTML =
          '<tr><td colspan="9" style="text-align:center;color:#c0392b;">Gagal memuat data.</td></tr>'
        return
      }

      const total = data.length
      const hadir = data.filter(p => p.sudah_hadir).length

      document.getElementById('s-total').textContent = total
      document.getElementById('s-hadir').textContent = hadir
      document.getElementById('s-belum').textContent = total - hadir
      document.getElementById('s-bakar').textContent = data.filter(p => p.menu === 'Ayam Bakar').length
      document.getElementById('s-katsu').textContent = data.filter(p => p.menu === 'Ayam Katsu').length
      document.getElementById('s-lava').textContent = data.filter(p => p.menu === 'Ayam Hot Lava').length

      if (total === 0) {
        document.getElementById('tabel-peserta').innerHTML =
          '<tr><td colspan="9" style="text-align:center;color:#888;padding:2rem;">Belum ada peserta.</td></tr>'
        return
      }

      document.getElementById('tabel-peserta').innerHTML = data.map(p => {
        const linkBukti = p.bukti_bayar
          ? `<a href="${CONFIG.supabase.url}/storage/v1/object/public/bukti-bayar/${p.bukti_bayar}" target="_blank" style="font-size:12px;color:#1a7f3c">Lihat</a>`
          : '—'

        const btnKonfirmasi = p.status_bayar === 'menunggu_konfirmasi'
          ? `<button class="btn-konfirmasi" onclick="konfirmasi('${p.kode_tiket}', this)">Konfirmasi</button>`
          : '—'

        return `
          <tr>
            <td>${p.nama}<br/><span style="font-size:11px;color:#aaa">${p.email}</span></td>
            <td>${p.angkatan || '—'}</td>
            <td style="font-weight:500">Rp ${p.harga ? p.harga.toLocaleString('id-ID') : '—'}</td>
            <td style="font-family:monospace;font-size:12px;color:#555;">${p.kode_tiket}</td>
            <td style="font-weight:600;color:#111;">${p.menu || '—'}</td>
            <td>${p.metode_bayar || '—'}</td>
            <td>${badgeBayar(p.status_bayar)}</td>
            <td>${linkBukti}</td>
            <td>${btnKonfirmasi}</td>
          </tr>
        `
      }).join('')
    }

    loadData()
  </script>
</body>
</html>
