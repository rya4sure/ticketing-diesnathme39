<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dies Natalis HME Ke-39</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 2rem 1rem; }
    .card { background: #fff; border-radius: 12px; padding: 2rem; max-width: 420px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    .info-box { background: #f8f8f8; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #888; }
    .info-val { font-weight: 500; }
    .harga-val { font-size: 18px; font-weight: 600; color: #1a7f3c; }
    .metode-box { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .metode-box h2 { font-size: 14px; margin-bottom: 10px; color: #555; }
    .rekening { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .rekening-sub { font-size: 13px; color: #888; }
    .qris-img { width: 100%; max-width: 220px; display: block; margin: 0 auto; border-radius: 8px; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    input[type="file"] { width: 100%; padding: 8px; border: 1px dashed #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 4px; cursor: pointer; }
    .field-err { font-size: 11px; color: #e24b4a; margin-top: 3px; display: none; }
    button { width: 100%; padding: 10px; background: #111; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    button:hover { background: #333; }
    button:disabled { background: #999; cursor: not-allowed; }
    .success { text-align: center; display: none; padding: 1rem 0; }
    .success h2 { font-size: 16px; margin-bottom: 8px; }
    .success p { font-size: 13px; color: #666; }
    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; background: #fff3cd; color: #856404; }
  </style>
</head>
<body>
  <div class="card">
    <div id="main-wrap">
      <h1>Selesaikan Pembayaran</h1>
      <p class="sub">TechFest 2025 · Sabtu, 15 November 2025</p>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">Nama</span>
          <span class="info-val" id="i-nama">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Angkatan</span>
          <span class="info-val" id="i-angkatan">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Kode Tiket</span>
          <span class="info-val" style="font-family:monospace;font-size:12px" id="i-kode">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status</span>
          <span class="status-badge">Menunggu Pembayaran</span>
        </div>
        <div class="info-row" style="margin-top:8px;border-top:1px solid #eee;padding-top:8px;">
          <span class="info-label">Total Bayar</span>
          <span class="harga-val" id="i-harga">—</span>
        </div>
      </div>

      <div class="metode-box" id="metode-box">
        <h2 id="metode-title">Instruksi Pembayaran</h2>
        <div id="metode-detail"></div>
      </div>

      <div id="upload-wrap">
        <label>Upload Bukti Pembayaran</label>
        <input type="file" id="bukti" accept="image/*" />
        <p class="field-err" id="err-bukti"></p>
        <button id="btn-kirim">Kirim Bukti Pembayaran</button>
      </div>
    </div>

    <div class="success" id="success-wrap">
      <div style="font-size:40px;margin-bottom:12px;">✅</div>
      <h2>Bukti Pembayaran Terkirim!</h2>
      <p>Panitia akan memverifikasi pembayaran kamu.<br/>Tiket akan aktif setelah dikonfirmasi.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const dbClient = window.supabase.createClient(
      CONFIG.supabase.url,
      CONFIG.supabase.anonKey
    )

    const METODE_INFO = {
      qris: {
        title: 'Scan QRIS di bawah ini',
        html: `<img src="qris.png" class="qris-img" alt="QRIS TechFest 2025"/>`
      },
      bri: {
        title: 'Transfer ke rekening BRI',
        html: `
          <p class="rekening">1234567890</p>
          <p class="rekening-sub">a.n. Nama Panitia</p>
          <p style="font-size:12px;color:#aaa;margin-top:8px;">Ganti dengan nomor rekening BRI kamu</p>
        `
      },
      gopay: {
        title: 'Transfer ke GoPay',
        html: `
          <p class="rekening">081234567890</p>
          <p class="rekening-sub">a.n. Nama Panitia</p>
          <p style="font-size:12px;color:#aaa;margin-top:8px;">Ganti dengan nomor GoPay kamu</p>
        `
      },
      dana: {
        title: 'Transfer ke Dana',
        html: `
          <p class="rekening">081234567890</p>
          <p class="rekening-sub">a.n. Nama Panitia</p>
          <p style="font-size:12px;color:#aaa;margin-top:8px;">Ganti dengan nomor Dana kamu</p>
        `
      }
    }

    const params = new URLSearchParams(window.location.search)
    const kode = params.get('kode')
    const nama = params.get('nama')
    const angkatan = params.get('angkatan')
    const harga = params.get('harga')
    const metode = params.get('metode')

    document.getElementById('i-nama').textContent = nama || '—'
    document.getElementById('i-angkatan').textContent = angkatan || '—'
    document.getElementById('i-kode').textContent = kode || '—'
    document.getElementById('i-harga').textContent = harga ? 'Rp ' + parseInt(harga).toLocaleString('id-ID') : '—'

    if (metode && METODE_INFO[metode]) {
      document.getElementById('metode-title').textContent = METODE_INFO[metode].title
      document.getElementById('metode-detail').innerHTML = METODE_INFO[metode].html
    }

    document.getElementById('btn-kirim').addEventListener('click', async function() {
      const file = document.getElementById('bukti').files[0]
      const btn = document.getElementById('btn-kirim')
      const errBukti = document.getElementById('err-bukti')

      if (!file) {
        errBukti.textContent = 'Pilih file bukti pembayaran terlebih dahulu.'
        errBukti.style.display = 'block'
        return
      }

      if (file.size > 2 * 1024 * 1024) {
        errBukti.textContent = 'Ukuran file maksimal 2MB.'
        errBukti.style.display = 'block'
        return
      }

      errBukti.style.display = 'none'
      btn.disabled = true
      btn.textContent = 'Mengirim...'

      const ext = file.name.split('.').pop()
      const fileName = kode + '_' + Date.now() + '.' + ext

      const { error: uploadError } = await dbClient.storage
        .from('bukti-bayar')
        .upload(fileName, file)

      if (uploadError) {
        errBukti.textContent = 'Gagal upload: ' + uploadError.message
        errBukti.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Kirim Bukti Pembayaran'
        return
      }

      const { error: updateError } = await dbClient
        .from('peserta')
        .update({ status_bayar: 'menunggu_konfirmasi', bukti_bayar: fileName, metode_bayar: metode })
        .eq('kode_tiket', kode)

      if (updateError) {
        errBukti.textContent = 'Gagal update status: ' + updateError.message
        errBukti.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Kirim Bukti Pembayaran'
        return
      }

      document.getElementById('main-wrap').style.display = 'none'
      document.getElementById('success-wrap').style.display = 'block'
    })
  </script>
</body>
</html>
